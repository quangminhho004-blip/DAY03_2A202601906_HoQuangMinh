<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce AI Assistant</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.7);
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --user-msg: #3b82f6;
            --ai-msg: rgba(51, 65, 85, 0.8);
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.15) 0px, transparent 50%);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            height: 85vh;
            display: flex;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 24px;
            background: rgba(15, 23, 42, 0.4);
        }

        .sidebar-header {
            margin-bottom: 32px;
        }

        .sidebar-header h1 {
            font-size: 1.25rem;
            font-weight: 600;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sidebar-header p {
            color: var(--text-muted);
            font-size: 0.875rem;
            margin-top: 4px;
        }

        .mode-selector {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .mode-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 12px 16px;
            border-radius: 12px;
            cursor: pointer;
            text-align: left;
            transition: all 0.3s ease;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .mode-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
        }

        .mode-btn.active {
            background: rgba(59, 130, 246, 0.15);
            border-color: var(--primary);
            color: var(--primary);
        }

        .mode-icon {
            font-size: 1.2rem;
        }

        /* Chat Area */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .chat-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.02);
        }

        .chat-title {
            font-weight: 500;
            font-size: 1.1rem;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: #10b981;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 10px #10b981;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
            70% { box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .chat-messages {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message {
            display: flex;
            gap: 12px;
            max-width: 80%;
            animation: slideUp 0.4s ease forwards;
            opacity: 0;
            transform: translateY(10px);
        }

        @keyframes slideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .user .avatar {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
        }

        .ai .avatar {
            background: linear-gradient(135deg, #475569, #334155);
        }

        .bubble {
            padding: 14px 18px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.5;
            position: relative;
        }

        .user .bubble {
            background: var(--user-msg);
            border-top-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.2);
        }

        .ai .bubble {
            background: var(--ai-msg);
            border-top-left-radius: 4px;
            border: 1px solid var(--border);
        }

        .react-thought {
            font-size: 0.85rem;
            color: #a78bfa;
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px dashed rgba(167, 139, 250, 0.3);
            font-family: monospace;
        }

        .react-action {
            font-size: 0.85rem;
            color: #34d399;
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px dashed rgba(52, 211, 153, 0.3);
            font-family: monospace;
        }

        .chat-input-container {
            padding: 20px 24px;
            background: rgba(15, 23, 42, 0.6);
            border-top: 1px solid var(--border);
        }

        .input-wrapper {
            display: flex;
            gap: 12px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 8px;
            transition: border-color 0.3s;
        }

        .input-wrapper:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }

        input[type="text"] {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            padding: 10px 14px;
            font-size: 1rem;
            outline: none;
        }

        input[type="text"]::placeholder {
            color: var(--text-muted);
        }

        button.send-btn {
            background: var(--primary);
            color: white;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        button.send-btn:hover {
            background: var(--primary-hover);
            transform: scale(1.05);
        }

        button.send-btn:active {
            transform: scale(0.95);
        }

        /* Typing indicator */
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 6px 4px;
        }

        .dot {
            width: 6px;
            height: 6px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h1>VinUni Lab 3</h1>
                <p>Chatbot vs ReAct Agent</p>
            </div>
            
            <div class="mode-selector">
                <button class="mode-btn active" id="btn-baseline" onclick="setMode('baseline')">
                    <span class="mode-icon">🤖</span>
                    <span>Chatbot Baseline</span>
                </button>
                <button class="mode-btn" id="btn-react" onclick="setMode('react')">
                    <span class="mode-icon">🧠</span>
                    <span>ReAct Agent</span>
                </button>
            </div>
        </div>

        <!-- Chat Area -->
        <div class="chat-area">
            <div class="chat-header">
                <div class="chat-title" id="current-mode-title">Chatbot Baseline Mode</div>
                <div class="status">
                    <div class="status-dot"></div>
                    Online
                </div>
            </div>

            <div class="chat-messages" id="chat-messages">
                <!-- Welcome Message -->
                <div class="message ai" style="animation-delay: 0.1s">
                    <div class="avatar">🤖</div>
                    <div class="bubble">
                        Xin chào! Tôi là trợ lý ảo hỗ trợ tra cứu đơn hàng và đổi/trả. Bạn cần tôi giúp gì hôm nay?
                    </div>
                </div>
            </div>

            <div class="chat-input-container">
                <div class="input-wrapper">
                    <input type="text" id="chat-input" placeholder="Nhập câu hỏi của bạn (VD: Đơn hàng DH001 có thông tin gì?)..." onkeypress="handleKeyPress(event)">
                    <button class="send-btn" onclick="sendMessage()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentMode = 'baseline'; // 'baseline' or 'react'

        function setMode(mode) {
            currentMode = mode;
            
            // Update UI
            document.getElementById('btn-baseline').classList.remove('active');
            document.getElementById('btn-react').classList.remove('active');
            
            if(mode === 'baseline') {
                document.getElementById('btn-baseline').classList.add('active');
                document.getElementById('current-mode-title').innerText = "Chatbot Baseline Mode";
            } else {
                document.getElementById('btn-react').classList.add('active');
                document.getElementById('current-mode-title').innerText = "ReAct Agent Mode";
            }

            // Clear chat and add welcome message
            const chatMessages = document.getElementById('chat-messages');
            chatMessages.innerHTML = '';
            
            const welcomeText = mode === 'baseline' 
                ? "Xin chào! Tôi là Chatbot Baseline (Cấp 2). Tôi trả lời dựa trên kiến thức tĩnh và không có khả năng dùng Tool. Bạn cần hỏi gì nào?"
                : "Xin chào! Tôi là ReAct Agent (Cấp 3). Tôi có thể suy luận và gọi Tool (như search_order, get_order_status). Bạn cần hỗ trợ đơn hàng nào?";
                
            appendMessage('ai', welcomeText);
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }

        function sendMessage() {
            const input = document.getElementById('chat-input');
            const message = input.value.trim();
            
            if (!message) return;
            
            // Append User Message
            appendMessage('user', message);
            input.value = '';
            
            // Show typing indicator
            const typingId = showTypingIndicator();
            
            // Simulate AI response after delay
            setTimeout(() => {
                removeTypingIndicator(typingId);
                simulateAIResponse(message);
            }, 1500);
        }

        function appendMessage(sender, text, isHtml = false) {
            const chatMessages = document.getElementById('chat-messages');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            
            const avatar = sender === 'user' ? '👤' : (currentMode === 'baseline' ? '🤖' : '🧠');
            
            const content = isHtml ? text : text.replace(/\n/g, '<br>');

            msgDiv.innerHTML = `
                <div class="avatar">${avatar}</div>
                <div class="bubble">${content}</div>
            `;
            
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function showTypingIndicator() {
            const chatMessages = document.getElementById('chat-messages');
            const id = 'typing-' + Date.now();
            
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ai`;
            msgDiv.id = id;
            
            msgDiv.innerHTML = `
                <div class="avatar">${currentMode === 'baseline' ? '🤖' : '🧠'}</div>
                <div class="bubble">
                    <div class="typing-indicator">
                        <div class="dot"></div>
                        <div class="dot"></div>
                        <div class="dot"></div>
                    </div>
                </div>
            `;
            
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return id;
        }

        function removeTypingIndicator(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function simulateAIResponse(userMessage) {
            const lowerMsg = userMessage.toLowerCase();
            
            if (currentMode === 'baseline') {
                // Mock Baseline behavior (Không có tool)
                if (lowerMsg.includes('dh001')) {
                    appendMessage('ai', "Rất tiếc, ở chế độ Baseline tôi không có quyền truy cập vào hệ thống tra cứu đơn hàng để kiểm tra DH001. Vui lòng liên hệ bộ phận hỗ trợ hoặc sử dụng công cụ tra cứu chính thức.");
                } else {
                    appendMessage('ai', "Cảm ơn câu hỏi của bạn. Quy trình mua hàng và đổi trả của chúng tôi thường mất 3-5 ngày làm việc để hoàn tất. Bạn vui lòng cung cấp thêm mã đơn hàng nếu cần tra cứu nhé, tuy nhiên tôi sẽ cần hệ thống ngoài để kiểm tra.");
                }
            } else {
                // Mock ReAct Agent behavior
                let responseHtml = '';
                
                if (lowerMsg.includes('dh001')) {
                    responseHtml = `
                        <div class="react-thought">🧠 Thought: Người dùng muốn tra cứu thông tin đơn hàng DH001. Tôi cần gọi tool search_order.</div>
                        <div class="react-action">🛠️ Action: search_order['DH001']</div>
                        <div class="react-action" style="color: #60a5fa">👁️ Observation: Đơn hàng DH001 - Trạng thái: Đang giao - Giá: 2.000.000 VNĐ</div>
                        <div class="react-thought">🧠 Thought: Tôi đã có đủ thông tin để trả lời người dùng.</div>
                        <div>🏁 Đơn hàng DH001 của bạn hiện đang trong trạng thái "Đang giao". Giá trị đơn hàng là 2.000.000 VNĐ. Bạn có cần hỗ trợ gì thêm không?</div>
                    `;
                } else if (lowerMsg.includes('đổi') || lowerMsg.includes('trả')) {
                    responseHtml = `
                        <div class="react-thought">🧠 Thought: Người dùng muốn đổi trả. Tôi cần mã đơn hàng để dùng tool process_return.</div>
                        <div>Để xử lý đổi/trả hàng, bạn vui lòng cung cấp mã đơn hàng (VD: DH002) và lý do đổi trả nhé!</div>
                    `;
                } else {
                    responseHtml = `
                        <div class="react-thought">🧠 Thought: Câu hỏi chung chung, không cần tra cứu dữ liệu.</div>
                        <div>Tôi có thể giúp bạn tra cứu trạng thái đơn hàng hoặc thực hiện yêu cầu đổi trả. Vui lòng cung cấp mã đơn hàng!</div>
                    `;
                }
                
                appendMessage('ai', responseHtml, true);
            }
        }
    </script>
</body>
</html>
